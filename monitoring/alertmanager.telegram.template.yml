global:
  resolve_timeout: 5m

route:
  group_by: [alertname, job, horizon]
  group_wait: 30s
  group_interval: 1m
  repeat_interval: 4h
  receiver: telegram

receivers:
  - name: telegram
    telegram_configs:
      - api_url: https://api.telegram.org
        bot_token: "__TELEGRAM_BOT_TOKEN__"
        chat_id: __TELEGRAM_CHAT_ID__
        send_resolved: true
        message: |
          [{{ .Status | toUpper }}] Weather MLOps alert
          {{ range .Alerts }}
          Alert: {{ .Labels.alertname }}
          Severity: {{ .Labels.severity }}
          Summary: {{ .Annotations.summary }}
          {{ end }}
