global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: weather-api
    metrics_path: /metrics
    static_configs:
      - targets: [weather-api:8000]
  - job_name: weather-model-monitoring
    honor_labels: true
    static_configs:
      - targets: [pushgateway:9091]
