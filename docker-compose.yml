services:
  weather-api:
    build: .
    environment:
      SEVEN_DAY_MODEL_MANIFEST: /app/models/seven_day_production/production_manifest.json
    volumes:
      - ./models:/app/models:ro
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      weather-api:
        condition: service_healthy
      alertmanager:
        condition: service_started
      pushgateway:
        condition: service_started

  pushgateway:
    image: prom/pushgateway:v1.9.0
    ports:
      - "${PUSHGATEWAY_PORT:-9091}:9091"

  alertmanager:
    image: prom/alertmanager:v0.31.1
    volumes:
      - ./monitoring/alertmanager.telegram.template.yml:/etc/alertmanager/alertmanager.telegram.template.yml:ro
      - ./monitoring/alertmanager-entrypoint.sh:/etc/alertmanager/entrypoint.sh:ro
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    entrypoint: ["/bin/sh", "/etc/alertmanager/entrypoint.sh"]
    command: ["--storage.path=/alertmanager"]
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlflow/mlflow.db --default-artifact-root /mlflow/artifacts
    volumes:
      - mlflow-data:/mlflow
    ports:
      - "${MLFLOW_PORT:-5000}:5000"

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_started

  postgres-airflow:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow-db-demo}
      POSTGRES_DB: airflow
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    image: apache/airflow:2.10.5-python3.12
    user: "0:0"
    depends_on:
      postgres-airflow:
        condition: service_healthy
    environment: &airflow-common-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:-airflow-db-demo}@postgres-airflow:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      PYTHONPATH: /opt/airflow/project
      _PIP_ADDITIONAL_REQUIREMENTS: pandas numpy scikit-learn xgboost scipy joblib pyyaml
    volumes: &airflow-common-volumes
      - ./airflow/dags:/opt/airflow/dags
      - ./:/opt/airflow/project
      - ./models:/opt/airflow/models
      - airflow-logs:/opt/airflow/logs
    command: >-
      bash -c "airflow db migrate &&
      airflow users create --username ${AIRFLOW_ADMIN_USER:-admin}
      --password ${AIRFLOW_ADMIN_PASSWORD:-airflow-demo}
      --firstname Demo --lastname Admin --role Admin
      --email admin@example.com || true"

  airflow-webserver:
    image: apache/airflow:2.10.5-python3.12
    user: "0:0"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-common-env
    volumes: *airflow-common-volumes
    command: webserver
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health"]
      interval: 20s
      timeout: 10s
      retries: 10

  airflow-scheduler:
    image: apache/airflow:2.10.5-python3.12
    user: "0:0"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-common-env
    volumes: *airflow-common-volumes
    command: scheduler

volumes:
  mlflow-data:
  grafana-data:
  airflow-postgres-data:
  airflow-logs:
