services:
  weather-api:
    build: .
    image: ${WEATHER_API_IMAGE:-weather-api:local}
    volumes:
      - ./models:/app/models:ro
      - ./monitoring:/app/monitoring:ro
      - prediction-logs:/app/monitoring/predictions
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      SEVEN_DAY_MODEL_MANIFEST: /app/models/seven_day_production/production_manifest.json
      MODEL_TRACK: champion
      MLFLOW_TRACKING_URI: http://mlflow:5000
      PREDICTION_LOG_PATH: /app/monitoring/predictions/api_predictions.jsonl
    depends_on:
      mlflow:
        condition: service_started
      prediction-logs-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  weather-api-canary:
    build: .
    image: ${WEATHER_API_IMAGE:-weather-api:local}
    volumes:
      - ./models:/app/models:ro
      - ./monitoring:/app/monitoring:ro
      - prediction-logs:/app/monitoring/predictions
    ports:
      - "${API_CANARY_PORT:-8001}:8000"
    environment:
      SEVEN_DAY_MODEL_MANIFEST: /app/models/seven_day_production/evaluation_manifest.json
      MODEL_TRACK: canary
      MLFLOW_TRACKING_URI: http://mlflow:5000
      PREDICTION_LOG_PATH: /app/monitoring/predictions/api_predictions_canary.jsonl
    depends_on:
      mlflow:
        condition: service_started
      prediction-logs-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  prediction-logs-init:
    image: alpine:3.20
    volumes:
      - prediction-logs:/data
    command: ["sh", "-c", "mkdir -p /data && chown -R 10001:10001 /data"]

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      weather-api:
        condition: service_healthy
      alertmanager:
        condition: service_started
      pushgateway:
        condition: service_started

  pushgateway:
    image: prom/pushgateway:v1.9.0
    ports:
      - "${PUSHGATEWAY_PORT:-9091}:9091"

  alertmanager:
    image: prom/alertmanager:v0.31.1
    volumes:
      - ./monitoring/alertmanager.telegram.template.yml:/etc/alertmanager/alertmanager.telegram.template.yml:ro
      - ./monitoring/alertmanager-entrypoint.sh:/etc/alertmanager/entrypoint.sh:ro
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    entrypoint: ["/bin/sh", "/etc/alertmanager/entrypoint.sh"]
    command: ["--storage.path=/alertmanager"]
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"

  mlflow:
    build:
      context: ./mlflow
    image: weather-mlflow:local
    depends_on:
      postgres-mlflow-init:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        case "$${MLFLOW_ARTIFACT_ROOT}" in s3://*) ;; *) echo "MLFLOW_ARTIFACT_ROOT must use s3://" >&2; exit 1 ;; esac;
        exec mlflow server --host 0.0.0.0 --port 5000
        --backend-store-uri "$${MLFLOW_BACKEND_STORE_URI}"
        --default-artifact-root "$${MLFLOW_ARTIFACT_ROOT}"
    environment:
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://mlflow:${MLFLOW_DB_PASSWORD:-mlflow-db-demo}@postgres-airflow:5432/mlflow
      MLFLOW_ARTIFACT_ROOT: ${MLFLOW_ARTIFACT_ROOT:?MLFLOW_ARTIFACT_ROOT must be set to an s3:// URI}
    ports:
      - "${MLFLOW_PORT:-5000}:5000"

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_started

  postgres-mlflow-init:
    image: postgres:16-alpine
    depends_on:
      postgres-airflow:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres-airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow-db-demo}
      MLFLOW_DB_PASSWORD: ${MLFLOW_DB_PASSWORD:-mlflow-db-demo}
    volumes:
      - ./postgres/init/create-mlflow-db.sh:/init/create-mlflow-db.sh:ro
    entrypoint: ["/bin/sh", "/init/create-mlflow-db.sh"]

  postgres-airflow:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow-db-demo}
      POSTGRES_DB: airflow
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    build:
      context: ./airflow
    image: weather-airflow:local
    user: "0:0"
    depends_on:
      postgres-airflow:
        condition: service_healthy
      mlflow:
        condition: service_started
    environment: &airflow-common-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:-airflow-db-demo}@postgres-airflow:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      PYTHONPATH: /opt/airflow/project
      ALERTMANAGER_URL: http://alertmanager:9093
      MLFLOW_TRACKING_URI: http://mlflow:5000
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      S3_STORAGE_BUCKET: ${S3_STORAGE_BUCKET:-${S3_FEATURE_BUCKET:-}}
      S3_FEATURE_BUCKET: ${S3_FEATURE_BUCKET:-${S3_STORAGE_BUCKET:-}}
      S3_FEATURE_PREFIX: ${S3_FEATURE_PREFIX:-weather-7d/features}
      WEATHER_LATITUDE: ${WEATHER_LATITUDE:-21.0285}
      WEATHER_LONGITUDE: ${WEATHER_LONGITUDE:-105.8542}
      WEATHER_TIMEZONE: ${WEATHER_TIMEZONE:-Asia/Bangkok}
    volumes: &airflow-common-volumes
      - ./airflow/dags:/opt/airflow/dags
      - ./:/opt/airflow/project
      - ./models:/opt/airflow/models
      - prediction-logs:/opt/airflow/project/monitoring/predictions
      - airflow-logs:/opt/airflow/logs
    command: >-
      bash -c "airflow db migrate &&
      airflow users create --username ${AIRFLOW_ADMIN_USER:-admin}
      --password ${AIRFLOW_ADMIN_PASSWORD:-airflow-demo}
      --firstname Demo --lastname Admin --role Admin
      --email admin@example.com || true"

  airflow-webserver:
    image: weather-airflow:local
    user: "0:0"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-common-env
    volumes: *airflow-common-volumes
    command: webserver
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health"]
      interval: 20s
      timeout: 10s
      retries: 10

  airflow-scheduler:
    image: weather-airflow:local
    user: "0:0"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-common-env
    volumes: *airflow-common-volumes
    command: scheduler

volumes:
  grafana-data:
  airflow-postgres-data:
  airflow-logs:
  prediction-logs:
